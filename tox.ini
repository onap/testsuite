[tox]
minversion = 3.2.0
envlist = json,yaml
skipsdist = true
requires = pip >= 8

[testenv]
basepython = python3.11
allowlist_externals =
  git
  /bin/sh
  sh
  /bin/bash
  bash
  xargs

[testenv:json]
deps =
skip_install = True
commands_pre =
    /bin/sh -c "git --no-pager diff HEAD^ HEAD --name-only --diff-filter=d '*.json' > /tmp/.changed_json"
commands =
    /bin/bash -c "cat /tmp/.changed_json | xargs -r -n1 python -m json.tool > /dev/null"

[testenv:yaml]
deps =
    yamllint==1.38.0
skip_install = True
commands_pre =
    /bin/sh -c "git --no-pager diff HEAD^ HEAD --name-only --diff-filter=d '*.yaml' '*.yml' > /tmp/.changed_yaml"
commands =
    /bin/bash -c "cat /tmp/.changed_yaml | xargs -r yamllint -c .yamllint"

[testenv:robot]
deps = robotframework-lint
dirs = robot

commands =
    python -m rflint --ignore LineTooLong --ignore RequireKeywordDocumentation --ignore RequireTestDocumentation -r {[testenv:robot]dirs}
